
<script>

const SUPABASE_URL =
  "https://mxmxwosyhsfjaaocazdl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kvmNO1rhN8lO2rRmJLz48Q_2X1KoMA9";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


async function loadPremiumResources() {

  const {
    data: { session },
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  if (sessionError || !session || !session.user) {

    window.location.replace("index.html");

    return;

  }


  const user = session.user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        full_name,
        email,
        membership,
        membership_plan,
        membership_status,
        membership_expiry_date
      `)
      .eq("id", user.id)
      .single();


  if (error || !profile) {

    document.body.innerHTML = `
      <div style="
        max-width:600px;
        margin:100px auto;
        padding:30px;
        text-align:center;
        font-family:Arial;
      ">
        <h2>Unable to load your account</h2>
        <p>Please try again.</p>
      </div>
    `;

    console.error(error);

    return;

  }


  const plan =
    profile.membership_plan ||
    profile.membership ||
    "Free";


  const status =
    profile.membership_status ||
    "Active";


  /*
    Update membership display.
    
    Keep these IDs if they already exist
    in your current premium-resources.html.
  */

  const membershipElement =
    document.getElementById("membership");

  if (membershipElement) {

    membershipElement.textContent =
      plan === "Pro Plus"
        ? "FinPortfolio Pro Plus"
        : plan === "Pro"
        ? "FinPortfolio Pro"
        : "Free";

  }


  const statusElement =
    document.getElementById("membershipStatus");

  if (statusElement) {

    statusElement.textContent =
      plan !== "Free"
        ? "● " + status
        : "";

  }


  /*
    RESOURCE ACCESS
  */

  const proResources =
    document.querySelectorAll(
      '[data-plan="Pro"]'
    );


  const proPlusResources =
    document.querySelectorAll(
      '[data-plan="Pro Plus"]'
    );


  proResources.forEach(function(resource) {

    if (
      plan === "Pro" ||
      plan === "Pro Plus"
    ) {

      resource.classList.remove("locked");

    } else {

      resource.classList.add("locked");

    }

  });


  proPlusResources.forEach(function(resource) {

    if (plan === "Pro Plus") {

      resource.classList.remove("locked");

    } else {

      resource.classList.add("locked");

    }

  });

}


/*
  START
*/

loadPremiumResources();

</script>
