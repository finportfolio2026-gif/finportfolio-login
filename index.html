<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPortfolio — Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3eb;
      color: #202020;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 7px 0 0;
      color: #666;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
      color: #777;
    }

    .tab.active {
      color: #8b1e2d;
      font-weight: bold;
      border-bottom: 2px solid #8b1e2d;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 17px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #8b1e2d;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: #8b1e2d;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>FINPORTFOLIO</h1>
      <p>Where Finance Meets Clarity</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" id="loginTab">Login</button>
        <button class="tab" id="signupTab">Create Account</button>
      </div>

      <form id="loginForm">

        <label>Email</label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

        <button class="btn" type="submit">
          Login
        </button>

      </form>

      <form id="signupForm" class="hidden">

        <label>Full Name</label>

        <input
          type="text"
          id="signupName"
          placeholder="Enter your full name"
          required
        >

        <label>Email</label>

        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>

        <input
          type="password"
          id="signupPassword"
          placeholder="Create a password"
          required
          minlength="6"
        >

        <button class="btn" type="submit">
          Create Account
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>

    <div class="footer">
      © 2026 FinPortfolio
    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://mxmxwosyhsfjaaocazdl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_kvmNO1rhN8lO2rRmJLz48Q_2X1KoMA9";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const loginForm =
      document.getElementById("loginForm");

    const signupForm =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");


    loginTab.addEventListener("click", () => {

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");

      message.textContent = "";

    });


    signupTab.addEventListener("click", () => {

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");

      message.textContent = "";

    });


    signupForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      message.textContent =
        "Creating your account...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,
          password: password,

          options: {
            data: {
              full_name: name
            }
          }

        });


      if (error) {

        message.textContent =
          error.message;

        return;

      }


      if (data.session) {

        window.location.href =
          "dashboard.html";

        return;

      }


      message.textContent =
        "Account created! Please check your email to verify your account.";

      signupForm.reset();

    });


    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      message.textContent =
        "Logging in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        message.textContent =
          error.message;

        return;

      }


      if (!data.session) {

        message.textContent =
          "Login session could not be created.";

        return;

      }


      window.location.href =
        "dashboard.html";

    });

  </script>

</body>
</html>
