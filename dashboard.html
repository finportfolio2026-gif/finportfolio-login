<script>

const SUPABASE_URL =
  "https://mxmxwosyhsfjaaocazdl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kvmNO1rhN8lO2rRmJLz48Q_2X1KoMA9";


/*
  LOAD SUPABASE LIBRARY FIRST
*/

function loadSupabase() {

  return new Promise(function(resolve, reject) {

    if (
      window.supabase &&
      typeof window.supabase.createClient === "function"
    ) {

      resolve();

      return;

    }


    const script =
      document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    script.onload = function() {

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ) {

        resolve();

      } else {

        reject(
          new Error("Supabase library failed to load.")
        );

      }

    };


    script.onerror = function() {

      reject(
        new Error("Unable to load Supabase library.")
      );

    };


    document.head.appendChild(script);

  });

}


let supabaseClient;


/*
  INITIALIZE SUPABASE
*/

async function initializeSupabase() {

  try {

    await loadSupabase();


    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    await loadDashboard();

  } catch (error) {

    console.error(
      "Supabase initialization error:",
      error
    );

    const status =
      document.getElementById("status");

    if (status) {

      status.textContent =
        "Unable to connect to your account.";

    }

  }

}


/*
  OPEN PREMIUM RESOURCES
*/

function openPremiumResources() {

  window.location.href =
    "premium-resources.html";

}


/*
  LOAD DASHBOARD
*/

async function loadDashboard() {

  /*
    RESTORE SAVED SESSION
  */

  const {
    data: { session },
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  if (sessionError) {

    console.error(sessionError);

    window.location.replace("index.html");

    return;

  }


  /*
    NO SESSION
  */

  if (!session || !session.user) {

    window.location.replace("index.html");

    return;

  }


  const user =
    session.user;


  /*
    GET PROFILE
  */

  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        full_name,
        email,
        membership,
        membership_plan,
        membership_status,
        membership_start_date,
        membership_expiry_date
      `)
      .eq("id", user.id)
      .single();


  if (profileError) {

    const status =
      document.getElementById("status");

    if (status) {

      status.textContent =
        "Unable to load profile.";

    }

    console.error(profileError);

    return;

  }


  /*
    BASIC PROFILE
  */

  document.getElementById("userName").textContent =
    profile.full_name || "User";


  document.getElementById("profileName").textContent =
    profile.full_name || "Not available";


  document.getElementById("profileEmail").textContent =
    profile.email || user.email;


  /*
    MEMBERSHIP
  */

  const plan =
    profile.membership_plan ||
    profile.membership ||
    "Free";


  const membershipElement =
    document.getElementById("membership");


  const statusElement =
    document.getElementById("membershipStatus");


  membershipElement.textContent =
    plan === "Pro Plus"
      ? "FinPortfolio Pro Plus"
      : plan === "Pro"
      ? "FinPortfolio Pro"
      : "Free";


  membershipElement.className =
    "membership " +
    (
      plan === "Pro Plus"
        ? "proplus"
        : plan === "Pro"
        ? "pro"
        : "free"
    );


  if (plan !== "Free") {

    statusElement.textContent =
      profile.membership_status === "Active"
        ? "● Active"
        : "● " +
          (
            profile.membership_status ||
            "Inactive"
          );

  } else {

    statusElement.textContent = "";

  }


  /*
    RESOURCE ACCESS
  */

  const proResources = [

    document.getElementById("proResource"),

    document.getElementById("proCaseStudies")

  ].filter(Boolean);


  const proPlusResources = [

    document.getElementById("proPlusResource"),

    document.getElementById("modelResource")

  ].filter(Boolean);


  /*
    FREE
  */

  if (plan === "Free") {

    proResources.forEach(function(resource) {

      resource.classList.add("locked");

      resource.onclick = null;

      resource.innerHTML = `

        <span class="badge badge-pro">
          🔒 PRO
        </span>

        <h3>📊 Premium Insights</h3>

        <p>
          Premium finance insights and selected reports.
          Upgrade your membership to access this resource.
        </p>

        <a href="#" class="upgrade">
          Upgrade to Pro →
        </a>

      `;

    });


    proPlusResources.forEach(function(resource) {

      resource.classList.add("locked");

      resource.onclick = null;

      resource.innerHTML = `

        <span class="badge badge-plus">
          🔒 PRO PLUS
        </span>

        <h3>📈 Advanced Research</h3>

        <p>
          Advanced research, financial models and market insights.
          Available with Pro Plus membership.
        </p>

        <a href="#" class="upgrade">
          View Pro Plus →
        </a>

      `;

    });

  }


  /*
    PRO
  */

  else if (plan === "Pro") {

    proResources.forEach(function(resource) {

      resource.classList.remove("locked");

      resource.style.cursor =
        "pointer";

    });


    proPlusResources.forEach(function(resource) {

      resource.classList.add("locked");

      resource.onclick = null;

      resource.innerHTML = `

        <span class="badge badge-plus">
          🔒 PRO PLUS
        </span>

        <h3>📈 Advanced Research</h3>

        <p>
          Advanced research, financial models and market insights.
          Upgrade to Pro Plus to unlock these resources.
        </p>

        <a href="#" class="upgrade">
          Upgrade to Pro Plus →
        </a>

      `;

    });

  }


  /*
    PRO PLUS
  */

  else if (plan === "Pro Plus") {

    proResources.forEach(function(resource) {

      resource.classList.remove("locked");

      resource.style.cursor =
        "pointer";

    });


    proPlusResources.forEach(function(resource) {

      resource.classList.remove("locked");

      resource.style.cursor =
        "pointer";

    });

  }


  const status =
    document.getElementById("status");

  if (status) {

    status.textContent =
      "Your account is active.";

  }

}


/*
  LOGOUT
*/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const logoutBtn =
      document.getElementById("logoutBtn");


    if (logoutBtn) {

      logoutBtn.addEventListener(
        "click",
        async function() {

          await supabaseClient.auth.signOut();

          window.location.replace(
            "index.html"
          );

        }
      );

    }


    /*
      START
    */

    initializeSupabase();

  }
);

</script>
