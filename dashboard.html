<script>
const SUPABASE_URL =
  "https://mxmxwosyhsfjaaocazdl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kvmNO1rhN8lO2rRmJLz48Q_2X1KoMA9";

let supabaseClient = null;

/* ================================
   LOAD SUPABASE
================================ */

function loadSupabase() {
  return new Promise((resolve, reject) => {

    if (window.supabase) {
      resolve();
      return;
    }

    const script = document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    script.onload = () => resolve();

    script.onerror = () =>
      reject(new Error("Supabase library failed to load"));

    document.head.appendChild(script);
  });
}


/* ================================
   INITIALIZE SUPABASE
================================ */

async function initializeSupabase() {

  try {

    await loadSupabase();

    if (!window.supabase) {
      throw new Error("Supabase library not available");
    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    await loadDashboard();

  } catch (error) {

    console.error(
      "Supabase initialization error:",
      error
    );

  }
}


/* ================================
   OPEN PREMIUM RESOURCES
================================ */

function openPremiumResources() {

  window.location.href =
    "premium-resources.html";

}


/* ================================
   LOAD DASHBOARD
================================ */

async function loadDashboard() {

  if (!supabaseClient) {
    console.error("Supabase client not initialized");
    return;
  }

  try {

    /* Get logged-in session */

    const {
      data: { session },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {

      console.error(
        "Session error:",
        sessionError
      );

      return;
    }


    /* No login session */

    if (!session || !session.user) {

      window.location.replace("index.html");

      return;
    }


    const user = session.user;


    /* ================================
       GET PROFILE
    ================================= */

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          full_name,
          email,
          membership,
          membership_plan,
          membership_status,
          membership_start_date,
          membership_expiry_date
        `)
        .eq("id", user.id)
        .single();


    if (profileError) {

      console.error(
        "Profile loading error:",
        profileError
      );

      return;
    }


    if (!profile) {

      console.error(
        "Profile not found"
      );

      return;
    }


    /* ================================
       MEMBERSHIP
    ================================= */

    const plan =
      profile.membership_plan ||
      profile.membership ||
      "Free";


    const status =
      profile.membership_status ||
      "Active";


    /* ================================
       USER NAME
    ================================= */

    const userName =
      document.getElementById("userName");

    if (userName) {

      userName.textContent =
        profile.full_name ||
        user.email ||
        "User";

    }


    /* ================================
       PROFILE NAME
    ================================= */

    const profileName =
      document.getElementById("profileName");

    if (profileName) {

      profileName.textContent =
        profile.full_name ||
        "User";

    }


    /* ================================
       EMAIL
    ================================= */

    const profileEmail =
      document.getElementById("profileEmail");

    if (profileEmail) {

      profileEmail.textContent =
        profile.email ||
        user.email ||
        "";

    }


    /* ================================
       MEMBERSHIP DISPLAY
    ================================= */

    const membershipElement =
      document.getElementById("membership");

    if (membershipElement) {

      if (plan === "Pro Plus") {

        membershipElement.textContent =
          "FinPortfolio Pro Plus";

      } else if (plan === "Pro") {

        membershipElement.textContent =
          "FinPortfolio Pro";

      } else {

        membershipElement.textContent =
          "Free";

      }

    }


    /* ================================
       MEMBERSHIP STATUS
    ================================= */

    const membershipStatus =
      document.getElementById(
        "membershipStatus"
      );

    if (membershipStatus) {

      if (plan !== "Free") {

        membershipStatus.textContent =
          "● " + status;

      } else {

        membershipStatus.textContent =
          "";

      }

    }


    /* ================================
       MEMBERSHIP PLAN BADGE
    ================================= */

    const planBadge =
      document.getElementById("planBadge");

    if (planBadge) {

      planBadge.textContent =
        plan === "Pro Plus"
          ? "PRO PLUS"
          : plan === "Pro"
          ? "PRO"
          : "FREE";

    }


    /* ================================
       EXPIRY DATE
    ================================= */

    const expiryElement =
      document.getElementById(
        "membershipExpiry"
      );

    if (
      expiryElement &&
      profile.membership_expiry_date
    ) {

      const expiryDate =
        new Date(
          profile.membership_expiry_date
        );

      expiryElement.textContent =
        expiryDate.toLocaleDateString(
          "en-IN",
          {
            day: "2-digit",
            month: "short",
            year: "numeric"
          }
        );

    }


    /* ================================
       RESOURCE ACCESS
    ================================= */

    const proResources =
      document.querySelectorAll(
        '[data-plan="Pro"]'
      );


    const proPlusResources =
      document.querySelectorAll(
        '[data-plan="Pro Plus"]'
      );


    /* PRO ACCESS */

    proResources.forEach(
      function(resource) {

        if (
          plan === "Pro" ||
          plan === "Pro Plus"
        ) {

          resource.classList.remove(
            "locked"
          );

        } else {

          resource.classList.add(
            "locked"
          );

        }

      }
    );


    /* PRO PLUS ACCESS */

    proPlusResources.forEach(
      function(resource) {

        if (
          plan === "Pro Plus"
        ) {

          resource.classList.remove(
            "locked"
          );

        } else {

          resource.classList.add(
            "locked"
          );

        }

      }
    );


    console.log(
      "Dashboard loaded successfully"
    );

    console.log(
      "Membership:",
      plan
    );

  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );

  }

}


/* ================================
   LOGOUT
================================ */

async function logoutUser() {

  if (!supabaseClient) {
    return;
  }

  try {

    const { error } =
      await supabaseClient.auth.signOut();

    if (error) {

      console.error(
        "Logout error:",
        error
      );

      return;
    }

    window.location.replace(
      "index.html"
    );

  } catch (error) {

    console.error(
      "Logout failed:",
      error
    );

  }

}


/* ================================
   PAGE LOAD
================================ */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    /* Logout button */

    const logoutButton =
      document.getElementById("logoutBtn");

    if (logoutButton) {

      logoutButton.addEventListener(
        "click",
        logoutUser
      );

    }


    /* Start Supabase */

    initializeSupabase();

  }
);
</script>
